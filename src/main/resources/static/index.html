<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信机器人控制台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f0f2f5; color: #1f1f1f; padding: 24px;
            display: flex; flex-direction: column; align-items: center; gap: 20px;
        }
        h1 { font-size: 20px; font-weight: 600; }
        .card {
            background: #fff; border-radius: 12px; padding: 20px 24px;
            width: 100%; max-width: 560px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }
        .card h2 { font-size: 15px; margin-bottom: 14px; color: #576b95; }
        .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
        .badge { padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
        .badge.off { background: #ffece8; color: #e54545; }
        .badge.on  { background: #e7f7ec; color: #18a058; }
        .muted { color: #8a8a8a; font-size: 13px; }
        #qrWrap {
            width: 240px; height: 240px; margin: 0 auto 12px;
            border: 1px solid #e5e5e5; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            background: #fff; padding: 8px;
        }
        #qrWrap canvas, #qrWrap img { max-width: 100%; max-height: 100%; }
        .qr-fallback { font-size: 12px; color: #8a8a8a; text-align: center; padding: 8px; word-break: break-all; }
        .link-line { text-align: center; margin: 6px 0; }
        .link-line a { color: #576b95; font-size: 13px; word-break: break-all; }
        .btn {
            border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px;
            cursor: pointer; background: #07c160; color: #fff; font-weight: 600;
        }
        .btn:disabled { background: #b9e6c9; cursor: default; }
        .btn.ghost { background: #f0f2f5; color: #333; }
        .row { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
        #chat { display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow-y: auto; }
        .msg { padding: 8px 12px; border-radius: 10px; font-size: 14px; max-width: 85%; line-height: 1.5; }
        .msg.user { align-self: flex-end; background: #95ec69; }
        .msg.bot  { align-self: flex-start; background: #f0f2f5; white-space: pre-wrap; }
        .composer { display: flex; gap: 8px; margin-top: 12px; }
        .composer input {
            flex: 1; border: 1px solid #e5e5e5; border-radius: 8px;
            padding: 9px 12px; font-size: 14px; outline: none;
        }
        .composer input:focus { border-color: #07c160; }
        .hint { font-size: 12px; color: #8a8a8a; margin-top: 10px; line-height: 1.6; }
        code { background: #f0f2f5; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>🤖 微信机器人控制台</h1>

    <div class="card">
        <h2>① 扫码登录微信</h2>
        <div class="status-row">
            <span id="loginBadge" class="badge off">未登录</span>
            <span id="connText" class="muted">连接状态：—</span>
            <span id="msgCount" class="muted">已收消息：0</span>
        </div>
        <div id="qrWrap"><span class="qr-fallback">正在获取二维码…</span></div>
        <div class="link-line" id="qrLinkLine" style="display:none">
            <a id="qrLink" href="#" target="_blank">在微信中打开此链接完成登录</a>
        </div>
        <div class="row">
            <button class="btn ghost" id="refreshBtn">刷新二维码</button>
        </div>
    </div>

    <div class="card">
        <h2>② 三层消息路由自测</h2>
        <div id="chat"></div>
        <div class="composer">
            <input id="chatInput" type="text" placeholder="Skill：23.5 乘以 4 等于多少 / RAG：你能做什么 / LLM：讲个笑话" />
            <button class="btn" id="sendBtn">发送</button>
        </div>
        <div class="hint">
            路由顺序：<code>SKILL</code>（关键词命中→工具执行）→ <code>RAG</code>（关键词命中→文档增强→LLM）→ <code>LLM</code>（兜底闲聊）。<br>
            Skill 工具：<code>calculate</code> · <code>get_time</code> · <code>get_stock</code>（+ 画图/语音/天气透传）｜ RAG 文档见 <code>RagService</code>
        </div>
    </div>

    <script>
        // ===== ① 二维码登录 =====
        const qrWrap = document.getElementById('qrWrap');
        const qrLinkLine = document.getElementById('qrLinkLine');
        const qrLink = document.getElementById('qrLink');
        const loginBadge = document.getElementById('loginBadge');
        const connText = document.getElementById('connText');
        const msgCount = document.getElementById('msgCount');

        function renderQr(content) {
            qrWrap.innerHTML = '';
            // 优先用 CDN 的 qrcode 库渲染可扫描的二维码；失败则退化为显示链接
            if (window.QRCode) {
                try {
                    new QRCode(qrWrap, { text: content, width: 224, height: 224, correctLevel: QRCode.CorrectLevel.M });
                    return;
                } catch (e) { /* fall through */ }
            }
            const f = document.createElement('div');
            f.className = 'qr-fallback';
            f.textContent = '二维码组件未加载，请直接打开下方链接：\n' + content;
            qrWrap.appendChild(f);
        }

        async function loadQr() {
            try {
                const resp = await fetch('/wechat/qrcode');
                const data = await resp.json();
                const content = data.qrcode || '';
                if (!content) {
                    qrWrap.innerHTML = '<span class="qr-fallback">未获取到二维码内容</span>';
                    return;
                }
                renderQr(content);
                qrLink.href = content.startsWith('http') ? content : '#';
                qrLink.textContent = content.length > 60 ? content.slice(0, 60) + '…' : content;
                qrLinkLine.style.display = 'block';
            } catch (e) {
                qrWrap.innerHTML = '<span class="qr-fallback">获取二维码失败：' + e.message + '</span>';
            }
        }

        async function refreshStatus() {
            try {
                const resp = await fetch('/wechat/status');
                const s = await resp.json();
                if (s.loggedIn) {
                    loginBadge.textContent = '已登录';
                    loginBadge.className = 'badge on';
                    qrWrap.innerHTML = '<span class="qr-fallback">✅ 登录成功，可以收发消息了</span>';
                    qrLinkLine.style.display = 'none';
                } else {
                    loginBadge.textContent = '未登录';
                    loginBadge.className = 'badge off';
                }
                connText.textContent = '连接状态：' + (s.connectionStatus || '—');
                msgCount.textContent = '已收消息：' + (s.receivedCount || 0);
            } catch (e) { /* 忽略单次轮询错误 */ }
        }

        document.getElementById('refreshBtn').addEventListener('click', loadQr);
        loadQr();
        refreshStatus();
        setInterval(refreshStatus, 2000); // 每 2 秒轮询登录状态

        // ===== ② 工具自测对话 =====
        const chat = document.getElementById('chat');
        const input = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendMsg(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function send() {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            appendMsg('user', text);
            sendBtn.disabled = true;
            try {
                const resp = await fetch('/wechat/route', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await resp.json();
                if (data.success) {
                    appendMsg('bot', '【' + data.tier + '】' + data.reply);
                } else {
                    appendMsg('bot', '❌ ' + data.message);
                }
            } catch (e) {
                appendMsg('bot', '❌ 请求失败：' + e.message);
            } finally {
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', send);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

        // 动态加载二维码渲染库（失败不影响登录，链接仍可用）
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js';
        s.onerror = () => {/* 退化方案已在 renderQr 中处理 */}
        document.head.appendChild(s);
    </script>
</body>
</html>
