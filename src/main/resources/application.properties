spring.application.name=demo

# ===== \u963F\u91CC\u4E91\u767E\u70BC\uFF08DashScope\uFF09\u914D\u7F6E =====
# \u8BFB\u53D6\u73AF\u5883\u53D8\u91CF DASHSCOPE_API_KEY\uFF08\u672A\u8BBE\u7F6E\u65F6\u4E3A\u7A7A\uFF0C\u8C03\u7528\u65F6\u4F1A\u7ED9\u51FA\u63D0\u793A\uFF09
dashscope.api-key=${DASHSCOPE_API_KEY:}
weather.api-key=${WEATHER_API_KEY:}
# ===== AMap (Gaode) Web Service config =====
amap.api-key=${AMAP_API_KEY:}
# \u5BF9\u8BDD\u6A21\u578B
dashscope.chat-model=qwen-plus
# \u5DE5\u5177\u6267\u884C\u6A21\u5F0F\uFF1Aserial=\u4E32\u884C\uFF08\u9010\u4E2A\u6267\u884C\uFF09\uFF1Bparallel=\u5E76\u884C\uFF08\u540C\u4E00\u8F6E\u591A\u4E2A\u5DE5\u5177\u5E76\u53D1\u6267\u884C\uFF09
dashscope.tool-execution-mode=parallel
# \u5E76\u884C\u6A21\u5F0F\u4E0B\u5DE5\u5177\u6267\u884C\u7EBF\u7A0B\u6570
dashscope.tool-execution-threads=4
# Max tool-call rounds for one conversation(\u8C03\u7528\u5DE5\u5177\u6700\u5927\u5FAA\u73AF\u6B21\u6570) (complex itinerary tasks: 10-15)
dashscope.tool-execution-max-rounds=12
# \u662F\u5426\u5F00\u542F\u8054\u7F51\u641C\u7D22\uFF08true=\u5F00\u542F\uFF1B\u547D\u4E2D\u5B9E\u65F6\u7C7B\u5173\u952E\u8BCD\u65F6\u624D\u641C\uFF0C\u666E\u901A\u804A\u5929\u4E0D\u641C\uFF09
dashscope.enable-search=true
# \u547D\u4E2D\u5B9E\u65F6\u7C7B\u5173\u952E\u8BCD\u540E\u662F\u5426\u5F3A\u5236\u641C\u7D22\uFF08true=\u5FC5\u641C\uFF0C\u907F\u514D\u6A21\u578B\u201C\u5077\u61D2\u201D\u4E0D\u641C\uFF09
dashscope.forced-search=true
# \u662F\u5426\u542F\u7528\u5782\u57DF\u641C\u7D22\uFF08\u5929\u6C14/\u6C47\u7387\u7B49\u7ED3\u6784\u5316\u6570\u636E\u66F4\u7CBE\u51C6\uFF09
dashscope.search-extension=true

# ===== \u5FAE\u4FE1\u767B\u5F55\u6001\u81EA\u52A8\u6062\u590D =====
# \u542F\u52A8\u65F6\u81EA\u52A8\u767B\u5F55\uFF1A\u5DF2\u4FDD\u5B58\u767B\u5F55\u6001\u5219\u76F4\u63A5\u6062\u590D\uFF1B\u5426\u5219\u83B7\u53D6\u4E8C\u7EF4\u7801\u5E76\u6253\u5370\u94FE\u63A5
wechat.auto-login=true
# \u767B\u5F55\u6001\u4FDD\u5B58\u6587\u4EF6\u4F4D\u7F6E
wechat.resume-file=${user.home}/.wechat-demo-resume.json
# ===== \u65E5\u5FD7\u7F16\u7801\uFF1A\u63A7\u5236\u53F0\u8F93\u51FA\u7EDF\u4E00 UTF-8 =====
# \u914D\u5408 run.cmd\uFF08chcp 65001\uFF09\u6216 Windows Terminal\uFF0CWindows \u63A7\u5236\u53F0\u624D\u80FD\u6B63\u5E38\u663E\u793A\u4E2D\u6587\u65E5\u5FD7
logging.charset.console=UTF-8

# ===== RAG guide retrieval (Milvus + DashScope embedding) =====
# DashScope embedding model via OpenAI-compatible endpoint (API key reused from DASHSCOPE_API_KEY)
rag.embedding.api-key=${DASHSCOPE_API_KEY:}
rag.embedding.model=text-embedding-v3
rag.embedding.dimensions=1024
rag.embedding.batch-size=10
# Milvus standalone (Docker, gRPC)
rag.milvus.host=localhost
rag.milvus.port=19530
rag.milvus.collection=trip_guide_chunks
# Retrieval: candidates per path / final top-k after rerank
rag.retrieve.candidates=20
rag.retrieve.top-k=5
# Rerank model (falls back to local rerank on failure)
rag.rerank.api-key=${DASHSCOPE_API_KEY:}
rag.rerank.model=gte-rerank-v2
# Build the index automatically on startup
rag.index.auto-build=true

# ===== Trip guard (scheduled monitoring alerts) =====
# Enable the periodic check loop; interval in minutes
monitor.enabled=true
monitor.check-interval-minutes=1

# ===== Agent state & memory =====
# Local JSON file persisting monitor targets and itineraries
app.state-file=${user.home}/.autotrip-state.json
# Max remembered messages per user (in-memory only)
agent.memory-size=10
